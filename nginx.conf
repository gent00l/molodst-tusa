server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }

    location ~* \.(js|css|woff2?|png|jpg|jpeg|webp|avif|svg|ico|mp4|webm|gltf|bin)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
